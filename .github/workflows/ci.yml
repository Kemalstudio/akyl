name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Flutter — анализ, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Анализ
        run: flutter analyze --fatal-infos

      - name: Тесты и покрытие
        run: flutter test --coverage

      - name: Порог покрытия ядра (ТЗ: не ниже 70%)
        run: |
          python3 - <<'PY'
          import sys
          hit = found = 0
          for line in open('coverage/lcov.info', encoding='utf-8'):
              if line.startswith('DA:'):
                  found += 1
                  hit += int(line.strip().split(',')[1]) > 0
          pct = 100 * hit / found if found else 0
          print(f'Покрытие: {hit}/{found} = {pct:.1f}%')
          sys.exit(0 if pct >= 70 else 1)
          PY

      - name: Сборка APK
        run: flutter build apk --release

      - name: В релизном манифесте нет INTERNET (ТЗ, раздел 3)
        run: |
          MANIFEST=build/app/intermediates/merged_manifests/release/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST=$(find build -name AndroidManifest.xml -path '*release*' | head -1)
          fi
          echo "Проверяю $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "INTERNET попал в релизную сборку — приватность нарушена"
            exit 1
          fi
          echo "INTERNET отсутствует"

      - uses: actions/upload-artifact@v4
        with:
          name: akyl-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ml:
    name: Python — генератор датасета
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Импорт словарей
        run: python -c "from data_gen import vocab; print(len(vocab.all_names()), 'имён')"
